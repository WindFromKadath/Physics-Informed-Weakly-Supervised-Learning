name: ci-smoke

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --python 3.11 --extra dev

      - name: Unit and regression tests
        run: uv run pytest

      - name: Independent simulation-correctness verification
        run: uv run python reproduction/scripts/verify_sim_correctness.py

      - name: Reproduction smoke (Section IV pipeline)
        run: >
          uv run python reproduction/run_reproduction.py
          --config reproduction/configs/smoke.yaml
          --output reproduction/results/smoke_ci

      - name: Migration smoke (heat pipeline)
        run: >
          uv run python migration/run_migration.py
          --config migration/configs/heat_smoke.yaml
          --output migration/results/heat_smoke_ci
