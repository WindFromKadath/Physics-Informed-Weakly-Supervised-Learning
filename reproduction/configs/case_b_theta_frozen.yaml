# Case B theta-frozen ablation (audit report P2): theta stays at the
# per-split eq.(12) calibration value (freeze_theta without a configured
# theta_frozen_value), isolating how much of the PWL error comes from the
# weakly-identifiable theta block.  refresh_weak_labels must be off because
# the two modes are mutually exclusive; weak labels are fixed at the
# calibrated theta here.
experiment:
  seed: 2026
  label_scenarios: [10, 100]
  n_splits: 5

case_b:
  data_root: datasets/case_b_spotweld
  n_weak: 120
  weak_seed: 9102026

train_fraction: 0.7
refit_on_train_validation: false

lambda_grid:
  physics: [0.01, 0.1, 1.0, 10.0]
  l1: [0.001, 0.01, 0.1]
  group: [0.001, 0.01, 0.1]

model:
  feature_spec: case_b
  # theta = tuning (contact resistance); SAVE prior box (09 doc §4.5).
  theta_lower: [0.8]
  theta_upper: [8.0]
  freeze_theta: true
  refresh_weak_labels: false
  mapping: identity
  standardize: true
  d_ridge: 10.0
  selection_rule: physics_one_standard_error
  n_jobs: 4
  parallel_verbose: 5
  parallel_temp_folder: reproduction/.joblib
  admm_rho: 1.0
  admm_adaptive_rho: true
  admm_tolerance: 0.00001
  admm_max_iter: 20000
  bcd_tolerance: 0.0001
  bcd_parameter_tolerance: 0.01
  bcd_max_iter: 80
  # Exactly one start: freezing keeps theta at the calibration init.
  theta_starts: 1
  require_convergence: true

baselines: [Ridge, SVR, DT, RF, GBDT, GP, Physics]

protocol:
  profile: case_b_theta_frozen
