[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pwl-repro"
version = "0.1.0"
description = "Reproduction framework for Physics-Informed Weakly-Supervised Learning"
readme = "reproduction/REPRODUCTION.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "PyMuPDF>=1.24",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pwl-repro = "pwl_repro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["reproduction/src/pwl_repro"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["reproduction/src"]
testpaths = ["reproduction/tests"]
